buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['NitroCountryPicker_' + name]
  }

  repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply from: '../nitrogen/generated/android/nitrocountrypicker+autolinking.gradle'

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroCountryPicker_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.nitrocountrypicker"

  compileSdk getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk getExtOrIntegerDefault("minSdkVersion")
    targetSdk getExtOrIntegerDefault("targetSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
              "META-INF",
              "META-INF/**",
              "**/libc++_shared.so",
              "**/libfbjni.so",
              "**/libjsi.so",
              "**/libfolly_json.so",
              "**/libfolly_runtime.so",
              "**/libglog.so",
              "**/libhermes.so",
              "**/libhermes-executor-debug.so",
              "**/libhermes_executor.so",
              "**/libreactnative.so",
              "**/libreactnativejni.so",
              "**/libturbomodulejsijni.so",
              "**/libreact_nativemodule_core.so",
              "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
    compose true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  maven { url 'https://jitpack.io' }
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")
def appcompat_version = "1.7.1"
def compose_bom_version = "2024.12.01"
def activity_compose_version = "1.13.0"

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation project(":react-native-nitro-modules")

  implementation "com.rejowan:ccpc:1.0.1"
  implementation platform("androidx.compose:compose-bom:$compose_bom_version")
  implementation "androidx.activity:activity-compose:$activity_compose_version"
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.runtime:runtime"
  implementation "androidx.compose.material3:material3"
  implementation "androidx.appcompat:appcompat:$appcompat_version"
  implementation "com.google.android.material:material:1.12.0"
}
